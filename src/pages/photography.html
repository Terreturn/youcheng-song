<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Photography by Youcheng Song. A collection of light, shadow, and perspective." />
    <title>Photography | Youcheng Song</title>
    <link rel="stylesheet" href="../styles/base.css" />
    <style>
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
            gap: var(--spacing-lg);
            margin-top: var(--spacing-xl);
        }

        .photo-item {
            background-color: var(--color-surface);
            border-radius: var(--radius-sm);
            overflow: hidden;
            break-inside: avoid;
            transition: opacity var(--transition-fast);
            aspect-ratio: 3/4;
            /* Vertical portrait style */
            position: relative;
            cursor: pointer;
        }

        .photo-item:hover {
            opacity: 0.9;
        }

        .photo-placeholder {
            width: 100%;
            height: 100%;
            background-color: #E5E5EA;
            /* Light gray placeholder */
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-text-secondary);
            font-size: var(--font-size-sm);
        }

        /* Make some wider for variety */
        .photo-item:nth-child(2n) {
            aspect-ratio: 4/3;
        }
    </style>
</head>

<body>
    <header class="header">
        <nav class="nav">
            <a href="../../index.html" class="nav-link">Home</a>
            <a href="photography.html" class="nav-link active">Photography</a>
            <a href="technical.html" class="nav-link">Data Science and Sports Analytics</a>
        </nav>
    </header>

    <main>
        <section class="section">
            <div class="container">
                <h1 class="text-title fade-in-up">Captured Moments.</h1>
                <p class="text-subtitle fade-in-up delay-100">A collection of light, shadow, and perspective.</p>

                <div class="gallery-grid fade-in-up delay-200">
                    <!-- Placeholders -->
                    <div class="photo-item">
                        <div class="photo-placeholder">Photo 1</div>
                    </div>
                    <div class="photo-item">
                        <div class="photo-placeholder">Photo 2</div>
                    </div>
                    <div class="photo-item">
                        <div class="photo-placeholder">Photo 3</div>
                    </div>
                    <div class="photo-item">
                        <div class="photo-placeholder">Photo 4</div>
                    </div>
                    <div class="photo-item">
                        <div class="photo-placeholder">Photo 5</div>
                    </div>
                    <div class="photo-item">
                        <div class="photo-placeholder">Photo 6</div>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
