<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Photography by Youcheng Song. A collection of light, shadow, and perspective." />
    <title>Photography | Youcheng Song</title>
    <link rel="stylesheet" href="../styles/base.css" />
    <style>
        .gallery-grid {
            --gallery-gap: clamp(12px, 2vw, 24px);
            column-count: 2;
            column-gap: var(--gallery-gap);
            margin-top: var(--spacing-xl);
        }

        @media (min-width: 900px) {
            .gallery-grid {
                column-count: 3;
            }
        }

        .photo-item {
            display: block;
            width: 100%;
            min-width: 0;
            margin-bottom: var(--gallery-gap);
            break-inside: avoid;
            background-color: var(--color-surface);
            border-radius: var(--radius-sm);
            overflow: hidden;
            transition: opacity var(--transition-fast);
            position: relative;
        }

        .photo-item:hover {
            opacity: 0.9;
        }

        .photo-item img {
            display: block;
            width: 100%;
            height: auto;
        }

        .photo-placeholder {
            width: 100%;
            aspect-ratio: 3 / 2;
            background-color: var(--color-divider);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-text-secondary);
            font-size: var(--font-size-sm);
        }

        .photo-item.portrait .photo-placeholder {
            aspect-ratio: 2 / 3;
        }
    </style>
</head>

<body>
    <header class="header">
        <nav class="nav" aria-label="Primary navigation">
            <a href="../../index.html" class="nav-link">Home</a>
            <a href="biography.html" class="nav-link">Biography</a>
            <a href="photography.html" class="nav-link active" aria-current="page">Photography</a>
            <a href="technical.html" class="nav-link">Data Science and Sports Analytics</a>
        </nav>
    </header>

    <main>
        <section class="section">
            <div class="container">
                <h1 class="text-title fade-in-up">Captured Moments.</h1>
                <p class="text-subtitle fade-in-up delay-100">A collection of light, shadow, and perspective.</p>

                <div class="gallery-grid fade-in-up delay-200">
                    <!-- Mixed-orientation placeholders. Real images retain their original proportions. -->
                    <div class="photo-item">
                        <div class="photo-placeholder">Photo 1</div>
                    </div>
                    <div class="photo-item portrait">
                        <div class="photo-placeholder">Photo 2</div>
                    </div>
                    <div class="photo-item">
                        <div class="photo-placeholder">Photo 3</div>
                    </div>
                    <div class="photo-item portrait">
                        <div class="photo-placeholder">Photo 4</div>
                    </div>
                    <div class="photo-item">
                        <div class="photo-placeholder">Photo 5</div>
                    </div>
                    <div class="photo-item">
                        <div class="photo-placeholder">Photo 6</div>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
