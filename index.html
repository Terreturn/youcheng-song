<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Portfolio</title>
    <link rel="stylesheet" href="src/styles/base.css" />
  </head>
  <body>
    <!-- Navigation -->
    <header class="header">
      <nav class="nav">
        <a href="index.html" class="nav-link active">Home</a>
        <a href="src/pages/photography.html" class="nav-link">Photography</a>
        <a href="src/pages/technical.html" class="nav-link">Technical</a>
      </nav>
    </header>

    <main>
      <section class="section">
        <div class="container text-center">
          <h1 class="text-display fade-in-up">Clean.<br>Simple.<br>Impactful.</h1>
          <p class="text-subtitle fade-in-up delay-100" style="margin-top: var(--spacing-lg);">
            Welcome to my digital space. I bridge the gap between<br>visual storytelling and technical engineering.
          </p>
          
          <div class="fade-in-up delay-200" style="margin-top: var(--spacing-2xl); display: flex; justify-content: center; gap: var(--spacing-md);">
            <a href="src/pages/photography.html" class="card-link">
              <div class="card">
                <h3>Photography</h3>
                <span>View Gallery &rarr;</span>
              </div>
            </a>
            <a href="src/pages/technical.html" class="card-link">
              <div class="card">
                <h3>Engineering</h3>
                <span>View Projects &rarr;</span>
              </div>
            </a>
          </div>
        </div>
      </section>
    </main>

    <!-- Simple Card Styles Inline for now (or move to base) -->
    <style>
      .card {
        background: var(--color-surface);
        padding: var(--spacing-xl);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-sm);
        width: 300px;
        text-align: left;
        transition: transform var(--transition-smooth), box-shadow var(--transition-smooth);
        border: 1px solid var(--color-border);
      }
      
      .card:hover {
        transform: translateY(-5px);
        box-shadow: var(--shadow-lg);
      }

      .card h3 {
        font-size: var(--font-size-xl);
        font-weight: var(--font-weight-semibold);
        margin-bottom: var(--spacing-xs);
        color: var(--color-text-primary);
      }

      .card span {
        font-size: var(--font-size-sm);
        color: var(--color-accent);
        font-weight: var(--font-weight-medium);
      }

      .card-link {
        text-decoration: none;
      }
      .card-link:hover {
        text-decoration: none;
      }
    </style>
  </body>
</html>
