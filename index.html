<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Youcheng Song's personal website: photography, data science, and sports analytics." />
    <title>Youcheng Song | Photography, Data Science and Sports Analytics</title>
    <link rel="stylesheet" href="src/styles/base.css" />
  </head>
  <body>
    <!-- Navigation -->
    <header class="header">
      <nav class="nav">
        <a href="index.html" class="nav-link active">Home</a>
        <a href="src/pages/photography.html" class="nav-link">Photography</a>
        <a href="src/pages/technical.html" class="nav-link">Data Science and Sports Analytics</a>
      </nav>
    </header>

    <main>
      <section class="section">
        <div class="container text-center">
          <h1 class="text-display fade-in-up">Youcheng<br>Song</h1>
          <p class="text-subtitle fade-in-up delay-100" style="margin-top: var(--spacing-lg);">
            Welcome to my personal space.<br>Photography, data science, and sports analytics.
          </p>
          
          <div class="home-links fade-in-up delay-200">
            <a href="src/pages/photography.html" class="card-link">
              <div class="card">
                <h3>Photography</h3>
                <span>View Gallery &rarr;</span>
              </div>
            </a>
            <a href="src/pages/technical.html" class="card-link">
              <div class="card">
                <h3>Data Science and Sports Analytics</h3>
                <span>View Projects &rarr;</span>
              </div>
            </a>
          </div>
        </div>
      </section>
    </main>

    <!-- Simple Card Styles Inline for now (or move to base) -->
    <style>
      .home-links {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
        gap: var(--spacing-md);
        max-width: 640px;
        margin: var(--spacing-2xl) auto 0;
      }

      .card {
        background: var(--color-surface);
        padding: var(--spacing-xl);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-sm);
        width: 100%;
        height: 100%;
        text-align: left;
        transition: transform var(--transition-smooth), box-shadow var(--transition-smooth);
        border: 1px solid var(--color-border);
      }
      
      .card:hover {
        transform: translateY(-5px);
        box-shadow: var(--shadow-lg);
      }

      .card h3 {
        font-size: var(--font-size-xl);
        font-weight: var(--font-weight-semibold);
        margin-bottom: var(--spacing-xs);
        color: var(--color-text-primary);
      }

      .card span {
        font-size: var(--font-size-sm);
        color: var(--color-accent);
        font-weight: var(--font-weight-medium);
      }

      .card-link {
        text-decoration: none;
      }
      .card-link:hover {
        text-decoration: none;
      }
    </style>
  </body>
</html>
